<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Code Explainer — Daksh Jain</title>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;400;500;600&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0d1117;--surface:#161b22;--border:#21262d;--text:#c9d1d9;--muted:#484f58;--accent:#58a6ff;--green:#3fb950;--purple:#bc8cff;--yellow:#d29922;--red:#f85149}
body{min-height:100vh;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif}

/* Top bar */
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:14px 24px;display:flex;align-items:center;gap:16px}
.logo{display:flex;align-items:center;gap:10px}
.logo-icon{width:32px;height:32px;background:linear-gradient(135deg,#58a6ff,#bc8cff);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px}
.logo-text{font-weight:700;font-size:16px}
.logo-sub{font-size:11px;color:var(--muted);margin-left:auto;font-family:'Fira Code',monospace}

/* Main layout */
.main{display:grid;grid-template-columns:1fr 1fr;height:calc(100vh - 57px)}
@media(max-width:768px){.main{grid-template-columns:1fr;height:auto}}

/* Left panel */
.panel{display:flex;flex-direction:column;border-right:1px solid var(--border)}
.panel-header{padding:14px 18px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
.panel-title{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--muted)}
.lang-select{background:#0d1117;border:1px solid var(--border);border-radius:6px;padding:5px 10px;color:var(--text);font-family:'Fira Code',monospace;font-size:12px;outline:none;cursor:pointer}
.lang-select:focus{border-color:var(--accent)}

/* Code editor */
.code-area{flex:1;position:relative}
.code-textarea{width:100%;height:100%;min-height:300px;background:#010409;border:none;outline:none;resize:none;padding:20px;color:#e6edf3;font-family:'Fira Code',monospace;font-size:13.5px;line-height:1.7;tab-size:2}
.code-textarea::placeholder{color:#2a3040}
.code-counter{position:absolute;bottom:10px;right:14px;font-size:10px;color:var(--muted);font-family:'Fira Code',monospace;background:#010409;padding:2px 6px;border-radius:4px}

/* Action bar */
.action-bar{padding:12px 18px;background:var(--surface);border-top:1px solid var(--border);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.explain-btn{background:var(--accent);border:none;border-radius:8px;padding:10px 22px;color:#000;font-weight:700;font-size:13px;cursor:pointer;font-family:'Inter',sans-serif;transition:all 0.2s;letter-spacing:0.5px}
.explain-btn:hover{background:#79b8ff;box-shadow:0 4px 16px rgba(88,166,255,0.3)}
.explain-btn:disabled{background:#1c2128;color:var(--muted);cursor:not-allowed}
.mode-btns{display:flex;gap:6px;margin-left:auto}
.mode-btn{background:none;border:1px solid var(--border);border-radius:6px;padding:7px 12px;color:var(--muted);font-size:11px;cursor:pointer;font-family:'Inter',sans-serif;font-weight:600;transition:all 0.15s;letter-spacing:0.5px;text-transform:uppercase}
.mode-btn.active,.mode-btn:hover{border-color:var(--accent);color:var(--accent);background:rgba(88,166,255,0.06)}

/* Right panel - output */
.output-panel{display:flex;flex-direction:column;background:var(--bg)}
.output-header{padding:14px 18px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
.out-dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.out-dot.active{background:var(--green);box-shadow:0 0 8px rgba(63,185,80,0.5)}
.output-body{flex:1;overflow-y:auto;padding:24px}
.output-body::-webkit-scrollbar{width:4px}
.output-body::-webkit-scrollbar-track{background:var(--bg)}
.output-body::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}

/* Output states */
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;text-align:center;color:var(--muted);gap:12px;min-height:200px}
.empty-icon{font-size:40px;opacity:0.3}
.empty-txt{font-size:14px}
.empty-hint{font-size:12px;opacity:0.6}

.loading-state{display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;padding:60px;color:var(--muted)}
.loading-state.show{display:flex}
.spinner{width:32px;height:32px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 0.8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.spin-txt{font-size:13px;font-family:'Fira Code',monospace}

/* Result blocks */
.result-block{margin-bottom:24px}
.block-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--muted);margin-bottom:10px;display:flex;align-items:center;gap:8px}
.block-title span{color:var(--accent);font-size:14px}
.block-body{font-size:14px;line-height:1.8;color:#adbac7}
.block-body strong{color:#e6edf3}
.block-body code{background:#1c2128;color:var(--purple);padding:1px 6px;border-radius:4px;font-family:'Fira Code',monospace;font-size:12.5px}

.step{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin-bottom:10px;display:flex;gap:14px;align-items:flex-start}
.step-num{min-width:24px;height:24px;background:rgba(88,166,255,0.15);color:var(--accent);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;font-family:'Fira Code',monospace}
.step-text{font-size:13.5px;line-height:1.7;color:#adbac7}
.step-text code{background:#010409;color:var(--purple);padding:1px 6px;border-radius:4px;font-family:'Fira Code',monospace;font-size:12px}

.complexity-badge{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:8px;font-size:12px;font-weight:700;font-family:'Fira Code',monospace;margin-bottom:12px}
.complexity-badge.easy{background:rgba(63,185,80,0.12);color:var(--green);border:1px solid rgba(63,185,80,0.25)}
.complexity-badge.medium{background:rgba(210,153,34,0.12);color:var(--yellow);border:1px solid rgba(210,153,34,0.25)}
.complexity-badge.hard{background:rgba(248,81,73,0.12);color:var(--red);border:1px solid rgba(248,81,73,0.25)}

.tag-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tag{font-size:11px;padding:3px 10px;border-radius:5px;font-weight:600;background:rgba(188,140,255,0.12);color:var(--purple);border:1px solid rgba(188,140,255,0.2)}

.error-banner{background:rgba(248,81,73,0.1);border:1px solid rgba(248,81,73,0.25);border-radius:10px;padding:14px;color:#fc8181;font-size:13px;margin-bottom:16px;display:none}

/* Snippet library */
.snippet-row{display:flex;gap:6px;flex-wrap:wrap;padding:12px 18px 0;border-top:1px solid var(--border);background:var(--surface)}
.snippet-btn{background:none;border:1px solid var(--border);border-radius:5px;padding:5px 10px;color:var(--muted);font-size:11px;cursor:pointer;font-family:'Fira Code',monospace;transition:all 0.15s}
.snippet-btn:hover{border-color:var(--accent);color:var(--accent)}
.snippet-label{font-size:10px;color:var(--muted);align-self:center;text-transform:uppercase;letter-spacing:1px;margin-right:4px}
</style>
</head>
<body>

<div class="topbar">
  <div class="logo">
    <div class="logo-icon">⚡</div>
    <div class="logo-text">Code Explainer <span style="color:var(--muted);font-weight:400">AI</span></div>
  </div>
  <div class="logo-sub">by Daksh Jain · Powered by Claude</div>
</div>

<div class="main">
  <!-- LEFT: Code input -->
  <div class="panel">
    <div class="panel-header">
      <span class="panel-title">// Input Code</span>
      <select class="lang-select" id="lang">
        <option value="auto">Auto-detect</option>
        <option value="python">Python</option>
        <option value="javascript">JavaScript</option>
        <option value="cpp">C++</option>
        <option value="java">Java</option>
        <option value="sql">SQL</option>
        <option value="html">HTML/CSS</option>
        <option value="bash">Bash</option>
      </select>
    </div>

    <div class="snippet-row">
      <span class="snippet-label">Try:</span>
      <button class="snippet-btn" onclick="loadSnippet('binary')">Binary Search</button>
      <button class="snippet-btn" onclick="loadSnippet('fib')">Fibonacci</button>
      <button class="snippet-btn" onclick="loadSnippet('bubble')">Bubble Sort</button>
      <button class="snippet-btn" onclick="loadSnippet('linked')">Linked List</button>
    </div>

    <div class="code-area">
      <textarea class="code-textarea" id="code-input" placeholder="# Paste any code here…&#10;&#10;def example(n):&#10;    if n <= 1:&#10;        return n&#10;    return example(n-1) + example(n-2)" oninput="updateCounter()" spellcheck="false"></textarea>
      <div class="code-counter" id="counter">0 lines</div>
    </div>

    <div class="action-bar">
      <button class="explain-btn" id="explain-btn" onclick="explain()">⚡ Explain Code</button>
      <div class="mode-btns">
        <button class="mode-btn active" id="mode-explain" onclick="setMode('explain')">Explain</button>
        <button class="mode-btn" id="mode-debug" onclick="setMode('debug')">Debug</button>
        <button class="mode-btn" id="mode-optimize" onclick="setMode('optimize')">Optimize</button>
      </div>
    </div>
  </div>

  <!-- RIGHT: Output -->
  <div class="output-panel">
    <div class="output-header">
      <div class="out-dot" id="out-dot"></div>
      <span style="font-size:13px;color:var(--muted);font-family:'Fira Code',monospace" id="out-status">Waiting for code…</span>
    </div>

    <div class="output-body" id="output-body">
      <div class="empty-state" id="empty-state">
        <div class="empty-icon">{'}'}</div>
        <div class="empty-txt">Paste code on the left and hit Explain</div>
        <div class="empty-hint">Supports Python, JS, C++, Java, SQL and more</div>
      </div>
      <div class="loading-state" id="loading-state">
        <div class="spinner"></div>
        <div class="spin-txt" id="spin-txt">Reading your code…</div>
      </div>
      <div class="error-banner" id="error-banner"></div>
      <div id="result-area" style="display:none"></div>
    </div>
  </div>
</div>

<script>
let currentMode = 'explain';

const snippets = {
  binary: `def binary_search(arr, target):
    left, right = 0, len(arr) - 1
    while left <= right:
        mid = (left + right) // 2
        if arr[mid] == target:
            return mid
        elif arr[mid] < target:
            left = mid + 1
        else:
            right = mid - 1
    return -1

# Example usage
arr = [1, 3, 5, 7, 9, 11, 13]
print(binary_search(arr, 7))  # Output: 3`,
  fib: `def fibonacci(n, memo={}):
    if n in memo:
        return memo[n]
    if n <= 1:
        return n
    memo[n] = fibonacci(n-1, memo) + fibonacci(n-2, memo)
    return memo[n]

for i in range(10):
    print(f"fib({i}) = {fibonacci(i)}")`,
  bubble: `def bubble_sort(arr):
    n = len(arr)
    for i in range(n):
        swapped = False
        for j in range(0, n-i-1):
            if arr[j] > arr[j+1]:
                arr[j], arr[j+1] = arr[j+1], arr[j]
                swapped = True
        if not swapped:
            break
    return arr

data = [64, 34, 25, 12, 22, 11, 90]
print(bubble_sort(data))`,
  linked: `class Node:
    def __init__(self, data):
        self.data = data
        self.next = None

class LinkedList:
    def __init__(self):
        self.head = None

    def append(self, data):
        new_node = Node(data)
        if not self.head:
            self.head = new_node
            return
        current = self.head
        while current.next:
            current = current.next
        current.next = new_node

    def display(self):
        elements = []
        current = self.head
        while current:
            elements.append(current.data)
            current = current.next
        return ' -> '.join(map(str, elements))`
};

function loadSnippet(key) {
  document.getElementById('code-input').value = snippets[key];
  document.getElementById('lang').value = 'python';
  updateCounter();
}

function updateCounter() {
  const lines = document.getElementById('code-input').value.split('\n').length;
  document.getElementById('counter').textContent = lines + ' line' + (lines===1?'':'s');
}

function setMode(mode) {
  currentMode = mode;
  document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('mode-'+mode).classList.add('active');
}

const spinMsgs = { explain: ['Reading your code…','Tracing execution flow…','Identifying patterns…','Writing explanation…'], debug: ['Scanning for issues…','Checking logic…','Finding bugs…'], optimize: ['Analysing complexity…','Finding bottlenecks…','Generating suggestions…'] };
let spinInt;

function startLoading() {
  document.getElementById('empty-state').style.display = 'none';
  document.getElementById('result-area').style.display = 'none';
  document.getElementById('error-banner').style.display = 'none';
  const ls = document.getElementById('loading-state');
  ls.classList.add('show');
  let i = 0; const msgs = spinMsgs[currentMode]||spinMsgs.explain;
  const el = document.getElementById('spin-txt'); el.textContent = msgs[0];
  spinInt = setInterval(() => { i=(i+1)%msgs.length; el.textContent=msgs[i]; }, 1300);
  document.getElementById('out-dot').className = 'out-dot';
  document.getElementById('out-status').textContent = 'Analyzing…';
}

function stopLoading() { clearInterval(spinInt); document.getElementById('loading-state').classList.remove('show'); }

const prompts = {
  explain: (code, lang) => `You are an expert programming teacher. Explain this ${lang} code clearly.

Code:
\`\`\`
${code}
\`\`\`

Return ONLY valid JSON with no markdown or code fences:
{"language":"detected language","title":"what this code does in 5 words","complexity":"easy|medium|hard","overview":"2-3 sentence overview of what this code does","steps":["step 1 description","step 2 description","step 3 description","step 4 description"],"concepts":["key concept 1","key concept 2","key concept 3"],"time_complexity":"O(?) with explanation","space_complexity":"O(?) with explanation"}`,

  debug: (code, lang) => `You are an expert debugger. Analyze this ${lang} code for bugs, errors, and issues.

Code:
\`\`\`
${code}
\`\`\`

Return ONLY valid JSON:
{"language":"detected language","has_bugs":true|false,"issues":["issue 1 with line reference","issue 2"],"fixes":["how to fix issue 1","how to fix issue 2"],"corrected_snippet":"the key corrected line(s) as a string","suggestions":["best practice suggestion 1","suggestion 2"]}`,

  optimize: (code, lang) => `You are a performance expert. Analyze this ${lang} code for optimization opportunities.

Code:
\`\`\`
${code}
\`\`\`

Return ONLY valid JSON:
{"language":"detected language","current_complexity":"O(?) description","optimized_complexity":"O(?) description","bottlenecks":["bottleneck 1","bottleneck 2"],"optimizations":["optimization 1","optimization 2","optimization 3"],"optimized_snippet":"key improved code as a string (short)","gains":"expected performance gain description"}`
};

function renderExplain(d) {
  const compCls = d.complexity==='easy'?'easy':d.complexity==='hard'?'hard':'medium';
  return `
    <div class="result-block">
      <div class="block-title"><span>📋</span> Overview</div>
      <div class="complexity-badge ${compCls}">Complexity: ${(d.complexity||'medium').toUpperCase()}</div>
      <div class="block-body">${d.overview||''}</div>
      <div class="tag-row">${(d.concepts||[]).map(c=>`<span class="tag">${c}</span>`).join('')}</div>
    </div>
    <div class="result-block">
      <div class="block-title"><span>🔢</span> Step-by-Step Walkthrough</div>
      ${(d.steps||[]).map((s,i)=>`<div class="step"><div class="step-num">${i+1}</div><div class="step-text">${s}</div></div>`).join('')}
    </div>
    <div class="result-block">
      <div class="block-title"><span>⚡</span> Complexity Analysis</div>
      <div class="block-body"><strong>Time:</strong> <code>${d.time_complexity||'—'}</code><br><br><strong>Space:</strong> <code>${d.space_complexity||'—'}</code></div>
    </div>`;
}

function renderDebug(d) {
  return `
    <div class="result-block">
      <div class="block-title"><span>${d.has_bugs?'🐛':'✅'}</span> ${d.has_bugs?'Issues Found':'No Critical Bugs'}</div>
      ${(d.issues||[]).map((s,i)=>`<div class="step"><div class="step-num" style="background:rgba(248,81,73,0.15);color:var(--red)">!</div><div class="step-text">${s}</div></div>`).join('')}
    </div>
    <div class="result-block">
      <div class="block-title"><span>🔧</span> Fixes</div>
      ${(d.fixes||[]).map((s,i)=>`<div class="step"><div class="step-num" style="background:rgba(63,185,80,0.15);color:var(--green)">✓</div><div class="step-text">${s}</div></div>`).join('')}
    </div>
    ${d.corrected_snippet?`<div class="result-block"><div class="block-title"><span>📝</span> Corrected Code</div><div class="block-body"><code>${escHtml(d.corrected_snippet)}</code></div></div>`:''}
    <div class="result-block">
      <div class="block-title"><span>💡</span> Best Practices</div>
      ${(d.suggestions||[]).map(s=>`<div class="step"><div class="step-num" style="background:rgba(188,140,255,0.15);color:var(--purple)">★</div><div class="step-text">${s}</div></div>`).join('')}
    </div>`;
}

function renderOptimize(d) {
  return `
    <div class="result-block">
      <div class="block-title"><span>📊</span> Complexity Comparison</div>
      <div class="block-body"><strong>Current:</strong> <code>${d.current_complexity||'—'}</code><br><br><strong>Optimized:</strong> <code>${d.optimized_complexity||'—'}</code><br><br>${d.gains||''}</div>
    </div>
    <div class="result-block">
      <div class="block-title"><span>⚠️</span> Bottlenecks</div>
      ${(d.bottlenecks||[]).map(s=>`<div class="step"><div class="step-num" style="background:rgba(210,153,34,0.15);color:var(--yellow)">▲</div><div class="step-text">${s}</div></div>`).join('')}
    </div>
    <div class="result-block">
      <div class="block-title"><span>🚀</span> Optimizations</div>
      ${(d.optimizations||[]).map(s=>`<div class="step"><div class="step-num" style="background:rgba(88,166,255,0.15);color:var(--accent)">→</div><div class="step-text">${s}</div></div>`).join('')}
    </div>
    ${d.optimized_snippet?`<div class="result-block"><div class="block-title"><span>💻</span> Improved Code</div><div class="block-body"><code>${escHtml(d.optimized_snippet)}</code></div></div>`:''}`;
}

function escHtml(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

async function explain() {
  const code = document.getElementById('code-input').value.trim();
  if (!code) return;
  const lang = document.getElementById('lang').value;
  document.getElementById('explain-btn').disabled = true;
  startLoading();

  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ model:'claude-sonnet-4-20250514', max_tokens:1000, messages:[{role:'user',content:prompts[currentMode](code.slice(0,2500),lang)}] })
    });
    const data = await res.json();
    if (data.error) throw new Error(data.error.message);
    let raw = ''; for(const b of(data.content||[])) if(b.type==='text') raw+=b.text;
    raw = raw.replace(/```json|```/gi,'').trim();
    const s=raw.indexOf('{'),e=raw.lastIndexOf('}');
    if(s<0||e<0) throw new Error('Invalid JSON response');
    const parsed = JSON.parse(raw.slice(s,e+1));

    stopLoading();
    const ra = document.getElementById('result-area');
    ra.innerHTML = currentMode==='explain'?renderExplain(parsed):currentMode==='debug'?renderDebug(parsed):renderOptimize(parsed);
    ra.style.display = 'block';
    document.getElementById('out-dot').className = 'out-dot active';
    document.getElementById('out-status').textContent = `${parsed.language||lang} · ${currentMode} complete`;
  } catch(err) {
    stopLoading();
    const eb = document.getElementById('error-banner');
    eb.textContent = '⚠ ' + err.message;
    eb.style.display = 'block';
    document.getElementById('out-status').textContent = 'Error';
  }
  document.getElementById('explain-btn').disabled = false;
}
</script>
</body>
</html>
